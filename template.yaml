AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: web-python-fastapi — python web app on Lambda (Lambda Web Adapter) behind an HTTP API

Parameters:
  Stage:
    Type: String
    Default: dev
  DomainName:
    Type: String
    Default: ''
    Description: Custom domain (api.example.com). Empty skips it.
  DomainCertificateArn:
    Type: String
    Default: ''
    Description: ACM certificate ARN for DomainName, same region. Empty skips the custom domain.
  PermissionsBoundaryArn:
    Type: String
    Default: ''
    Description: The boundary the execution role SAM creates must carry (a connected account's ActionPlatformAppBoundary). Empty sets none.
  RolePath:
    Type: String
    Default: /
    Description: IAM path of the execution role SAM creates (a connected account's /action-platform/<prefix>/).

Conditions:
  IsProd: !Equals [!Ref Stage, prod]
  HasPermissionsBoundary: !Not [!Equals [!Ref PermissionsBoundaryArn, '']]
  HasCustomDomain: !Not [!Equals [!Ref DomainCertificateArn, '']]

Globals:
  Function:
    Timeout: 30
    MemorySize: 512
    Architectures: [arm64]

Resources:
  ApiFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: makefile
      cfn-lint:
        config:
          ignore_checks: [E3031]
    Properties:
      FunctionName: !Sub "${AWS::StackName}-api"
      CodeUri: .
      Handler: run.sh
      Runtime: python3.12
      PermissionsBoundary: !If [HasPermissionsBoundary, !Ref PermissionsBoundaryArn, !Ref AWS::NoValue]
      RolePath: !Ref RolePath
      Layers:
        - !Sub arn:aws:lambda:${AWS::Region}:753240598075:layer:LambdaAdapterLayerArm64:25
      Environment:
        Variables:
          SCOPE: !Ref Stage
          PORT: "8080"
          AWS_LWA_PORT: "8080"
          AWS_LWA_READINESS_CHECK_PATH: /health
          AWS_LAMBDA_EXEC_WRAPPER: /opt/bootstrap
      Events:
        Http:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /{proxy+}
            Method: ANY

  ApiLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/${AWS::StackName}-api"
      RetentionInDays: !If [IsProd, 90, 14]

  HttpApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      StageName: $default
      RouteSettings:
        "$default":
          ThrottlingRateLimit: 100
          ThrottlingBurstLimit: 200

  ApiDomainName:
    Type: AWS::ApiGatewayV2::DomainName
    Condition: HasCustomDomain
    Properties:
      DomainName: !Ref DomainName
      DomainNameConfigurations:
        - CertificateArn: !Ref DomainCertificateArn
          EndpointType: REGIONAL

  ApiDomainMapping:
    Type: AWS::ApiGatewayV2::ApiMapping
    Condition: HasCustomDomain
    Properties:
      ApiId: !Ref HttpApi
      DomainName: !Ref ApiDomainName
      Stage: !Ref HttpApi.Stage

Outputs:
  ApiUrl:
    Value: !Sub "https://${HttpApi}.execute-api.${AWS::Region}.amazonaws.com"
  CustomDomainTarget:
    Condition: HasCustomDomain
    Description: Point the DNS record for DomainName at this regional target
    Value: !GetAtt ApiDomainName.RegionalDomainName
